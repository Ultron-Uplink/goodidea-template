name: Task
description: One small, buildable unit of work (one PR).
labels: ["agent-created"]
body:
  - type: markdown
    attributes:
      value: "Read AGENTS.md. One issue, one small PR; branch ends with the ticket short name. Run pnpm verify before opening the PR, include Closes #N, and leave merging to the owner (L0)."
  - type: input
    id: fr
    attributes: { label: FR-IDs, description: "e.g. FR-3, FR-4" }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal, description: "One or two sentences." }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: "Checkable statements. Each maps to a test." }
    validations: { required: true }
  - type: textarea
    id: files
    attributes: { label: Files and area, description: "Likely files; add one area:* label." }
  - type: textarea
    id: out
    attributes: { label: Out of scope }
